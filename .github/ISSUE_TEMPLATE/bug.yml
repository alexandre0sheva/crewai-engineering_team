name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please **do not paste API keys, `.env` contents, or private code**.
        For security problems use a private advisory instead (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you run, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The exact command and a minimal request file if possible.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: engineering-team version
      placeholder: "0.2.0 (see pyproject.toml or `pip show engineering_team`)"
    validations:
      required: true
  - type: input
    id: crewai
    attributes:
      label: CrewAI version and model provider
      placeholder: "crewai 1.15.23, openai/..."
  - type: input
    id: environment
    attributes:
      label: Python and OS
      placeholder: "Python 3.12, macOS 15"
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Trim to the relevant lines and remove any secrets.
      render: text
