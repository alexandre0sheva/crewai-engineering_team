name: Website

# Builds the public site (MkDocs Material: docs/, the examples' run reports and the generated
# leaderboard) and deploys it to GitHub Pages. One-time setup by the repository owner:
# Settings -> Pages -> Source: "GitHub Actions". The site is then published at
# https://alexandre0sheva.github.io/crewai-engineering_team/ on every push to main that touches
# the paths below. No secrets are used: the build runs offline and `pull_request` never deploys.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "examples/**"
      - "benchmarks/results/**"
      - "mkdocs.yml"
      - "scripts/build_leaderboard.py"
      - "scripts/mkdocs_hooks.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install the site dependencies
        run: uv sync --locked --group site
      - name: Documentation checks
        run: uv run python scripts/check_docs.py
      - name: Leaderboard is up to date
        run: uv run python scripts/build_leaderboard.py --check
      - uses: actions/configure-pages@v6
      - name: Build the site
        run: uv run mkdocs build --strict
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
