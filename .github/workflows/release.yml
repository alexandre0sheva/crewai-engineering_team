name: Release

# Push a tag `vX.Y.Z` (see "Releasing" in CONTRIBUTING.md) to build the package, check that the
# wheel installs and runs on Linux and macOS, and publish a GitHub Release whose notes are the
# version's CHANGELOG section. Publishing to PyPI is off until you enable it (see the last job).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CREWAI_DISABLE_TELEMETRY: "true"
  OTEL_SDK_DISABLED: "true"

jobs:
  build:
    name: Build and check the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: The tag names the version in pyproject.toml and CHANGELOG.md has its section
        run: |
          version="$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${version}." >&2
            exit 1
          fi
          uv run --no-project python scripts/release_notes.py --check
          uv run --no-project python scripts/release_notes.py "${version}" > release-notes.md
      - name: Documentation checks
        run: uv run --no-project python scripts/check_docs.py
      - name: Build sdist and wheel
        run: uv build --out-dir dist
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: |
            dist/
            release-notes.md
          if-no-files-found: error

  smoke:
    name: Wheel smoke test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - name: Install the wheel in a clean environment and run it from an unrelated directory
        run: |
          uv venv "$RUNNER_TEMP/smoke-venv"
          uv pip install --python "$RUNNER_TEMP/smoke-venv/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke-venv/bin/engineering-team" --help
          "$RUNNER_TEMP/smoke-venv/bin/engineering-team" examples list
          "$RUNNER_TEMP/smoke-venv/bin/engineering-team" team list

  github-release:
    name: GitHub Release
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - name: Create the release from the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag ${prerelease}

  pypi:
    name: Publish to PyPI
    needs: [github-release]
    # Off until you turn it on: create the PyPI project, add this repository and workflow as a
    # trusted publisher (https://docs.pypi.org/trusted-publishers/), create a `pypi` environment
    # here, and set the repository variable PUBLISH_TO_PYPI to `true`.
    if: ${{ vars.PUBLISH_TO_PYPI == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
