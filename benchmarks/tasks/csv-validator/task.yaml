id: csv-validator
title: CSV validator driven by a JSON schema
kind: greenfield
mode: new
subset: dev
scale: 0.7
criteria:
  - {id: valid-file, text: "a valid file exits 0 and prints 'OK: N rows'"}
  - {id: type-errors, text: "wrong types are reported with the row and column"}
  - {id: required-and-unique, text: "empty required values and repeated unique values are reported"}
  - {id: constraints, text: "min, max, pattern and allowed are enforced, boundaries included"}
  - {id: header-and-usage, text: "a missing header column is an error (exit 1); unreadable inputs exit 2"}
  - {id: quoted-fields, text: "quoted fields with commas and newlines parse as one record"}
sabotage:
  fails: [constraints]
  edits:
    - path: csvcheck/rules.py
      old: "number < low"
      new: "number <= low"
