    request: |
      Build a new multi-tenant booking platform for fitness studios.

      Studios sign up and manage their own schedule of classes, instructors and rooms. Members
      book, cancel and join waiting lists; a member who cancels less than two hours before a
      class loses the credit. Studios sell class packs and monthly memberships through a
      payment provider, and members get email reminders the day before a class.

