      and a platform admin console for us. Authentication with email and password plus
      optional Google sign-in; each studio's data must be strictly isolated from the others.

      Provide an HTTP API that the front ends use, with OpenAPI documentation, reports of
      attendance and revenue per studio and month, and an audit log of admin actions.

      Deploy with Docker: one container for the API, one for the web apps, PostgreSQL for
      storage, and a worker for reminders. Include end-to-end tests for booking, cancelling,
      waiting lists and payments, and a CI pipeline that runs them on every pull request.
    expect: {intents: [new_project, devops], size: large, target: new, risk: high}
    signals:
