# Labelled requests for triage (docs/BENCHMARKS.md, "Triage"). `bench triage` checks every case's
# signal expectations offline (deterministic, free) and scores the signals-only guess; `bench
# triage --live` also asks the cheap-tier model once per case and reports its accuracy and a
# confusion matrix of primary intents.
#
# Per case:
#   repo     a benchmark task id whose fixture/ is the repository, "@empty" for an empty
#            directory, or absent for "no directory" (the request is not about a local project)
#   git      the repository is made a Git repository first (default true)
#   mode     an explicit 0.2.0 mode or maintenance preset (it wins over the model)
#   expect   the label: intents (primary first, then the secondary ones the request asks for),
#            size, target, and optionally risk and clarify (a good triage asks questions)
#   signals  what the signal layer must report; every field is checked, and an absent field
#            means false/empty (git_repo and existing_code default to what repo/git set up)
