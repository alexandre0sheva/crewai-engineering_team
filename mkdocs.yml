# The public website (GitHub Pages): the pages are docs/*.md as they are, plus the landing page
# (docs/index.md), the examples gallery and the generated leaderboard. Build it locally with
#   uv sync --group site && uv run python scripts/build_leaderboard.py && uv run mkdocs build --strict
# (CONTRIBUTING.md, "The website"). Nothing is copied: scripts/mkdocs_hooks.py adds the example run
# reports to the build and turns links that leave docs/ into links to the repository.
site_name: Engineering Team
site_description: A team of AI specialists that builds, changes and fixes software, and proves what it did.
site_url: https://alexandre0sheva.github.io/crewai-engineering_team/
repo_url: https://github.com/alexandre0sheva/crewai-engineering_team
repo_name: alexandre0sheva/crewai-engineering_team
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
strict: true

# The implementation plan is a working document, not part of the product's documentation.
exclude_docs: |
  IMPLEMENTATION_PLAN_0.3.0.md

hooks:
  - scripts/mkdocs_hooks.py

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Switch to dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Switch to light mode}
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/sortable.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      # GitHub's anchors, so the docs' own links (checked by scripts/check_docs.py) work on both.
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Using it:
      - Usage: USAGE.md
      - Configuration: CONFIGURATION.md
      - Examples: examples.md
  - How it works:
      - Architecture: ARCHITECTURE.md
      - Team: TEAM.md
      - Tools: TOOLS.md
      - Harness: HARNESS.md
      - Safety: SAFETY.md
  - Evidence:
      - Leaderboard: leaderboard.md
      - Benchmarks: BENCHMARKS.md
  - Changelog: https://github.com/alexandre0sheva/crewai-engineering_team/blob/main/CHANGELOG.md
