[project]
name = "engineering_team"
version = "0.2.0"
description = "A reusable, lead-managed CrewAI engineering team for building MVP applications"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15.23,<1.16",
]

[project.scripts]
engineering-team = "engineering_team.main:run"
engineering_team = "engineering_team.main:run"
run_crew = "engineering_team.main:run"
train = "engineering_team.main:train"
replay = "engineering_team.main:replay"
test = "engineering_team.main:test"
run_with_trigger = "engineering_team.main:run_with_trigger"

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "ruff>=0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
    # CrewAI's own validators read deprecated Agent/Crew defaults while building agents;
    # this project never sets allow_code_execution, reasoning, or function_calling_llm.
    "ignore::DeprecationWarning:crewai.*",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.format]
# Ruff 0.16 also formats fenced code in Markdown; keep docs (e.g. AGENTS.md) untouched.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
