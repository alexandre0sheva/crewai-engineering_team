[project]
name = "engineering_team"
version = "0.2.0"
description = "A team of AI specialists that builds, changes and fixes software, and proves what it did: a CrewAI pipeline in which a controller, not the agents, runs the checks and decides what counts as done."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Oleksandr Shevchenko" }]
keywords = [
    "crewai", "ai-agents", "multi-agent", "software-engineering", "code-generation", "llm",
    "bug-fixing", "code-review", "verification",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "crewai[tools]>=1.15.31,<1.16",
    "pyyaml>=6.0.3,<7",  # recipes and stage prompts (also a CrewAI dependency; declared, not assumed)
    "pydantic>=2.12.5,<3",  # settings and contracts (also a CrewAI dependency; declared, not assumed)
    "typer>=0.27.3,<1",  # the command-line interface
    "rich>=14.3.4,<15",  # its live progress view, tables, and panels (<15: CrewAI's `instructor` caps it)
]

[project.optional-dependencies]
# Native CrewAI provider SDKs; install only what you use, e.g. `uv sync --extra anthropic`.
anthropic = ["crewai[anthropic]>=1.15.31,<1.16"]
google = ["crewai[google-genai]>=1.15.31,<1.16"]
azure = ["crewai[azure-ai-inference]>=1.15.31,<1.16"]
# Headless-browser tools for UI verification (then `playwright install chromium`).
browser = ["playwright>=1.64.1,<2"]
# The local web UI's API server (`engineering-team ui`).
ui = [
    "fastapi>=0.162",
    "uvicorn>=0.54",
    "python-multipart>=0.0.32",  # file uploads when starting a run
]

[project.urls]
Homepage = "https://github.com/alexandre0sheva/crewai-engineering_team"
Repository = "https://github.com/alexandre0sheva/crewai-engineering_team"
Issues = "https://github.com/alexandre0sheva/crewai-engineering_team/issues"
Changelog = "https://github.com/alexandre0sheva/crewai-engineering_team/blob/main/CHANGELOG.md"

[project.scripts]
engineering-team = "engineering_team.main:run"
engineering_team = "engineering_team.main:run"
run_crew = "engineering_team.main:run_crew"

[dependency-groups]
dev = [
    "fastapi>=0.162",  # the web UI's tests (also the [ui] extra)
    "httpx>=0.28.1",  # FastAPI's TestClient
    "python-multipart>=0.0.32",
    "mypy>=2.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

# The benchmark suite (tasks, hidden checks, results) lives in the repository only.
[tool.hatch.build.targets.sdist]
exclude = ["/benchmarks"]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "live: calls a real model provider; runs only with ENGINEERING_LIVE_TESTS=1 and an API key",
    "docker: needs a running Docker daemon; skipped when `docker info` fails",
    "browser: drives a real headless browser; skipped without Playwright and Chromium (or Chrome)",
    "git: a pipeline run that commits to a real repository (unmarked tests make no stage commits)",
]
filterwarnings = [
    # CrewAI's own validators read deprecated Agent/Crew defaults while building agents;
    # this project never sets allow_code_execution, reasoning, or function_calling_llm.
    "ignore::DeprecationWarning:crewai.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Benchmark fixtures and reference solutions are *data* (what the team starts from, what a good
# answer looks like): they are compared and replayed byte for byte, never linted or reformatted.
# So are the example projects the team is pointed at (``examples/*/repo``) and the code the team
# wrote in a benchmark batch (``benchmarks/results``), which is a record, not source.
extend-exclude = [
    "benchmarks/results",
    "benchmarks/tasks/*/fixture",
    "benchmarks/tasks/*/change",
    "benchmarks/tasks/*/reference",
    "examples/*/repo",
]

[tool.ruff.format]
# Ruff 0.16 also formats fenced code in Markdown; keep docs (e.g. AGENTS.md) untouched.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The JavaScript run inside the page is one string; wrapping it would only hurt readability.
"src/engineering_team/browsertools/scripts.py" = ["E501"]

[tool.mypy]
files = ["src"]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
