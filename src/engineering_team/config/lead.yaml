# The team strategy's lead (pipeline/lead.py): when it calls a teammate, and the deterministic
# signals that make the controller review a change for security. Data, not code, so harness
# tuning (T21) can change it; every line of `guidance` goes into the lead's prompt as written.
guidance:
  - Do the work yourself by default; a teammate costs a session of its own and starts cold.
  - Independent parts with disjoint paths (two modules, a backend and a frontend) can go to
    teammates side by side with Delegate Parallel while you integrate.
  - A different stack from the one you are working in (a frontend while you do the backend) is
    worth a Delegate to the teammate for that stack.
  - Once a non-trivial change is ready, Ask Reviewer once and fix what matters.
  - A check that still fails after two tries of your own goes to Ask Debugger.
  - A change touching authentication, secrets, crypto, SQL, subprocesses or deserialisation
    gets Ask Security Review after your last change.
  - Large or unclear work gets Ask Architect (a plan draft) or Ask Analyst (the criteria)
    before you build.
  - Brief a teammate like a colleague who has not seen your session - the goal, the files,
    the criteria, what done looks like - and give it only the paths it needs.

# Regular expressions (case-insensitive) matched against the request and the text of every file
# the run changed; any match makes the controller run its security review of the final change
# unless the lead asked for one after its last change.
security_signals:
  auth: '\b(auth[a-z]*|login|log in|passwords?|oauth|jwt|sessions?|cookies?|permissions?)\b'
  crypto: '\b(crypto[a-z]*|encrypt[a-z]*|decrypt[a-z]*|hashlib|hmac|bcrypt|argon2)\b'
  subprocess: '\b(subprocess|os\.system|popen|child_process|shell\s*=\s*true)\b'
  sql: '(\bsql[a-z]*\b|\bcursor\.execute\b|\bselect\s+.+\s+from\b|\binsert\s+into\b)'
  deserialisation: '\b(pickle|yaml\.load|marshal\.loads?|deseriali[sz][a-z]*|unserialize)\b'
  secrets: '\b(secrets?|api[_ -]?keys?|private[_ -]?keys?|credentials?)\b'
