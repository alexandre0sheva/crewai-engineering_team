# Task prompts for the pipeline's stages (strategy "pipeline" and "single"). Roles, goals, and
# backstories live in agents.yaml; nothing here repeats them. Placeholders are interpolated per
# stage: {project_name} {requirements} {workspace_path} {current_date} {spec} {plan} {package}
# {card} {notes} {resume_note} {failures} {findings} {context} {teammates}. {spec}, {plan} and
# {package} are JSON; the others are text; {context} is empty unless the user supplied reference
# documents (--context-dir); {teammates} lists who work packages can go to. The ``repair`` prompt is
# the verify stage's: the controller's failing checks are {failures}; ``repair_review`` is its
# prompt for review findings ({findings}). ``review`` is run once per reviewer.

spec:
  description: >
    Turn the request for {project_name} into a testable specification. Do not write files
    and do not design the solution: say what must be true, not how to build it.

    Request:

    {requirements}

    {context}

    Produce a specification with: a short title and summary; acceptance criteria that can each
    be checked by running or inspecting the result, numbered AC-1, AC-2, ... (each id used once,
    never renumbered) with a kind of functional, quality, constraint, or security; explicit
    non-goals; and the assumptions you make where the request is silent. Keep it to the
    smallest useful MVP and invent nothing the request does not support.

    Also report your confidence in your reading of the request (high, medium, or low). List a
    blocking question only when its answer would materially change the product and you cannot
    reasonably assume it; for each one, also write the answer you would assume under
    assumptions, so work can go on if nobody answers. Put minor uncertainties in
    open_questions, not in blocking_questions. Ask at most five blocking questions.

    {card}
    {notes}
    {resume_note}
  expected_output: >
    A JSON specification (title, summary, criteria, non_goals, assumptions, open_questions,
    confidence, blocking_questions).

plan:
  description: >
    Design the solution for {project_name} and split the work. Inspect the current project
    tree at {workspace_path}; reuse coherent existing code.

    The specification below is the contract: design for its acceptance criteria and non-goals.
    The original request is given only for context; where it disagrees with the specification,
    follow the specification.

    Specification:

    {spec}

    Original request:

    {requirements}

    {context}

    Teammates available for work packages (a package's role is a teammate's key, or its short
    form without "_engineer"; a role nobody has goes to the first teammate listed):

    {teammates}

    Choose the smallest suitable stack (do not force Python, a web UI, or any framework the
    specification does not support) and prefer one working vertical slice over breadth. Write
    docs/architecture.md (goals and non-goals, stack and why, project tree, data model and
    contracts, flows, security boundaries, failure behaviour). Then return the plan: the stack;
    the exact project commands (setup, test, lint, build, run) as lists of command lines; and
    work packages. Each work package has an id (WP-1, ...), a title, a role ("backend",
    "frontend", ...; only create a frontend package if the product has a user interface), a
    description, the paths it owns (gitignore-style globs, for example "src/api/**"), the ids
    of the packages it depends on, and the acceptance criteria ids it delivers (existing ids
    from the specification; every package delivers at least one, and every criterion is
    delivered by some package). Packages that do not depend on each other run at the same time
    and may change only the paths they own, so give each package its own directories (tests
    belong to the package they test) and make owned paths disjoint. Never give a package a
    shared root file such as README.md, package.json, pyproject.toml, a lockfile, or CI
    configuration: the foundation stage owns those and an integration stage runs afterwards to
    reconcile the packages. Mark a package "required": false only if the product works without
    it. Also list the main risks.

    {card}
    {notes}
    {resume_note}
  expected_output: >
    docs/architecture.md written in the workspace, and a JSON plan (stack, commands,
    work_packages, risks).

foundation:
  description: >
    Create the shared project foundation for {project_name} in {workspace_path}.

    Specification:

    {spec}

    Plan:

    {plan}

    Create or improve a conventional structure for the chosen stack: dependency and tool
    configuration, a safe .gitignore, .env.example when configuration is needed, and a useful
    README.md (setup, run, test, architecture notes). Implement the shared pieces every work
    package will build on and the thinnest real vertical slice. Leave no placeholder functions
    where working behaviour is feasible. Install only necessary dependencies and run the
    cheapest relevant compile, import, or build check. Preserve compatible existing behaviour.

    {card}
    {notes}
    {resume_note}
  expected_output: >
    A runnable project foundation with README.md. Report files changed, dependencies added,
    commands run with their exit codes, and the remaining work.

implement:
  description: >
    Implement one work package of {project_name} in {workspace_path}.

    Specification:

    {spec}

    Plan:

    {plan}

    Your work package:

    {package}

    Read the architecture and the code that exists before editing. Implement real, end to end
    behaviour for the acceptance criteria this package delivers, add focused tests next to the
    code, validate inputs and error paths, keep secrets out of the repository, and run the
    relevant tests or smoke checks. You may change only the paths your package owns
    (owned_paths); teammates are working on the others at the same time, so everything else is
    read-only for you. If you need a change elsewhere (a shared file, another package's
    interface), do not work around it: describe it in your summary or in a card comment so the
    integration stage can make it.

    {card}
    {notes}
    {resume_note}
  expected_output: >
    The work package implemented in the workspace with tests. Report the criteria delivered,
    files changed, commands run with their exit codes, and any honest limitation.

integrate:
  description: >
    Integrate the work packages of {project_name} in {workspace_path}. They were built in
    parallel, each by an agent that could change only its own paths, so they may disagree where
    they meet (interfaces, imports, configuration, shared files).

    Specification:

    {spec}

    Plan:

    {plan}

    Work package results (status, summary, error):

    {packages}

    Read what each package delivered, then build the whole project and run its tests, lint, and
    type checks. Fix cross-package contract mismatches and anything a skipped or failed
    optional package left dangling; you may change any file, including the shared files
    (README.md, dependency manifests, CI configuration). Keep fixes minimal and do not
    rewrite a package's design. Write docs/integration.md listing what you ran with exit
    statuses, every change you made and why, and any package that is missing or incomplete.

    {card}
    {notes}
    {resume_note}
  expected_output: >
    A project whose packages work together, and docs/integration.md recording the commands run
    and every change made.

repair:
  description: >
    The controller ran its own independent checks on {project_name} in {workspace_path} and
    some required ones failed. You did not run them, and what you report does not change the
    outcome: the controller runs the same checks again when you finish, and only passing checks
    count.

    Specification:

    {spec}

    Plan:

    {plan}

    What failed:

    {failures}

    Find the cause of each failure (read the failing code and tests; run the check's command
    yourself to reproduce it) and fix the code. Never weaken, delete, skip, or special-case a
    test or a check to get it green, and do not edit docs/verification.md (the controller writes
    it). Keep the changes minimal and in scope; if a failure shows the specification itself is
    wrong, say so instead of bending the code. Run the failing command again before you finish.
    Reply with a short summary: the root cause, the files you changed, and anything you could
    not fix. The controller records it in docs/qa-notes.md; do not write that file yourself.

    {card}
    {notes}
    {resume_note}
  expected_output: >
    The failing checks fixed in the workspace, and a short summary of the root cause, the files
    changed, and what is still failing.

review:
  description: >
    Review the finished project {project_name} in {workspace_path}. You can only read it: do
    not write or change any file, and do not report anything you have not seen in the code.

    Specification:

    {spec}

    Read the specification, then the source files, tests, configuration, and documentation
    (use the search, symbol, and Git history tools to find your way), and judge the project
    against your own checklist. Report each real defect once, with the file and line, a
    severity (critical, high, medium, low, info) that reflects its impact on the product, and
    a concrete suggested fix. Leave out style preferences and anything that is not a defect.
    If you find nothing, say so with an empty list. If you ran a tool, name it and what it
    reported; if a tool could not run, say that instead of guessing.

    {card}
    {notes}
    {resume_note}
  expected_output: >
    A JSON review report: a one- or two-sentence summary and a findings list (each finding has
    severity, summary, file, line, and suggested_fix).

repair_review:
  description: >
    Independent reviewers read {project_name} in {workspace_path} and found problems the
    controller wants fixed. What you report does not change the outcome: the controller runs
    its checks again when you finish, and only passing checks count.

    Specification:

    {spec}

    Plan:

    {plan}

    Review findings to fix:

    {findings}

    For each finding, confirm it in the code first (a finding can be wrong; if it is, leave
    the code alone and say why), then make the smallest correct fix. Never weaken, delete, skip,
    or special-case a test or a check to get it green, and do not edit docs/verification.md or
    docs/review.md (the controller writes them). Run the project's tests again before you
    finish. Reply with a short summary: for each finding id, fixed or not and why, and the files
    you changed. The controller records it in docs/qa-notes.md; do not write that file yourself.

    {card}
    {notes}
    {resume_note}
  expected_output: >
    The confirmed findings fixed in the workspace, and a short summary per finding id.

devops:
  description: >
    Prepare {project_name} in {workspace_path} to be run and shipped.

    Specification:

    {spec}

    Plan (it has the project's commands):

    {plan}

    Read the project and its README first, then add only what fits: a Dockerfile when the
    project is a service or would benefit from one (pinned base image, non-root user, no
    secrets baked in) and a .dockerignore; a CI workflow (for example .github/workflows/ci.yml)
    that runs the project's own install, test, lint, and build commands; a complete
    .env.example listing every environment variable the code reads, with placeholder values;
    and short run scripts only where they save steps. Do not change application code. Run
    whatever you can to check your files (the project commands, a Docker build if Docker is
    available) and record what you could not run. Write docs/devops.md: each file you added or
    changed and why, the commands you ran with their outcome, and what is unchecked.

    {card}
    {notes}
    {resume_note}
  expected_output: >
    The delivery files in the workspace and docs/devops.md recording them and what was run.

docs:
  description: >
    Write the documentation of {project_name} in {workspace_path}.

    Specification:

    {spec}

    Plan:

    {plan}

    Read the code, the tests, and the existing README first. Then: make README.md accurate (what
    it is and who it is for, install, run, test, configuration, limitations); write
    docs/usage.md (how to use every feature with real, verified examples); and add or update
    CHANGELOG.md (Keep a Changelog style, one entry for this release). Run each command you
    document and mark any step you could not check as unchecked rather than presenting it as
    working. Change documentation files only, never application code, and do not edit
    docs/verification.md, docs/review.md, or docs/release-report.md.

    {card}
    {notes}
    {resume_note}
  expected_output: >
    An accurate README.md, docs/usage.md, and CHANGELOG.md, and a short summary of what was
    checked.

release:
  description: >
    Perform a release-readiness review of {project_name} in {workspace_path}.

    Specification:

    {spec}

    Re-read the request, the architecture, the controller's verification record
    (docs/verification.md; read it, do not edit it), the README, and the important source files. Confirm the project is coherent, starts with its documented
    commands, and delivers the primary vertical slice. Fix only targeted integration,
    documentation, or configuration issues, then rerun the affected check. Make sure README.md
    gives a new developer accurate setup, configuration, run, test, and troubleshooting steps.

    Write docs/release-report.md: delivered scope, criteria status, architecture summary,
    verification evidence, known limitations, security notes, and the next three improvements.
    Do not claim production readiness when only MVP readiness was shown.

    {card}
    {notes}
    {resume_note}
  expected_output: >
    A coherent project with accurate onboarding documentation and docs/release-report.md, and
    a concise delivery summary with the workspace path.

build:
  description: >
    Build {project_name} end to end in {workspace_path}, on your own.

    Request:

    {requirements}

    Choose the smallest suitable stack, design a minimal architecture, implement a working
    vertical slice with focused automated tests, run the tests and a build or startup smoke
    check, fix what fails, and write a README.md (setup, run, test) plus docs/release-report.md
    (delivered scope, how it was verified, known limitations). Inspect the existing workspace
    first and reuse coherent code. Never report a check as passing unless you ran it.

    {card}
    {notes}
    {resume_note}
  expected_output: >
    A working, tested project with README.md and docs/release-report.md, and a summary of what
    was built, what was verified, and what is missing.
