# Task prompts for the pipeline's stages (strategy "pipeline" and "single"). Roles, goals, and
# backstories live in agents.yaml; nothing here repeats them. Placeholders are interpolated per
# stage: {project_name} {requirements} {workspace_path} {current_date} {spec} {plan} {package}
# {card} {notes} {resume_note} {failures} {findings} {context} {teammates}. {spec}, {plan} and
# {package} are JSON; the others are text; {context} is empty unless the user supplied reference
# documents (--context-dir); {teammates} lists who work packages can go to. The ``repair`` prompt is
# the verify stage's: the controller's failing checks are {failures}; ``repair_review`` is its
# prompt for review findings ({findings}). ``review`` is run once per reviewer. ``analyze_chunk``
# is run once per chunk of an existing codebase ({chunk} is its brief) and ``analyze_synthesis``
# once after them ({synthesis} holds the chunk analyses and the detected facts). ``spec_change``,
# ``impact``, ``implement_change``, ``tests`` and ``review_change`` are the ``feature`` recipe's:
# a change to an existing project ({base} is the commit the team started from; {context} carries
# the codebase map). ``triage``, ``reproduce``, ``fix``, ``repair_fix`` and ``review_fix`` are the
# ``fix`` recipe's: {bug} is what the controller knows about the report (a parsed stack trace, the
# person's repro command), {instructions} is the task a recipe's own stage wrote (``custom``),
# {triage}, {repro} and {fix_note} are earlier stages' JSON ({upgrades} is the group of dependency
# upgrades an ``upgrade`` stage applies, {audit} what the controller's dependency audit found), and
# {resume_note} also carries the controller's verdict on the previous reproduction attempt. The
# ``maintain`` recipes' prompts are ``add_tests`` ({coverage}: where the tests are thinnest),
# ``refactor``, ``docs_legacy``, ``dependency_plan``, ``upgrade_apply``, ``audit_security``,
# ``fix_findings`` (the serious findings are {findings}) and their ``repair_*`` and
# ``review_maintain`` companions; ``review_diff`` is the ``review`` command's.

spec:
  description: >
    Turn the request for {project_name} into a testable specification. Do not write files
    and do not design the solution: say what must be true, not how to build it.

    Request:

    {requirements}

    {context}

    Produce a specification with: a short title and summary; acceptance criteria that can each
    be checked by running or inspecting the result, numbered AC-1, AC-2, ... (each id used once,
    never renumbered) with a kind of functional, quality, constraint, or security; explicit
    non-goals; and the assumptions you make where the request is silent. Keep it to the
    smallest useful MVP and invent nothing the request does not support.

    Also report your confidence in your reading of the request (high, medium, or low). List a
    blocking question only when its answer would materially change the product and you cannot
    reasonably assume it; for each one, also write the answer you would assume under
    assumptions, so work can go on if nobody answers. Put minor uncertainties in
    open_questions, not in blocking_questions. Ask at most five blocking questions.

    {card}
    {notes}
    {resume_note}
  expected_output: >
    A JSON specification (title, summary, criteria, non_goals, assumptions, open_questions,
    confidence, blocking_questions).

plan:
  description: >
    Design the solution for {project_name} and split the work. Inspect the current project
    tree at {workspace_path}; reuse coherent existing code.

    The specification below is the contract: design for its acceptance criteria and non-goals.
    The original request is given only for context; where it disagrees with the specification,
    follow the specification.

    Specification:

    {spec}

    Original request:

    {requirements}

    {context}

    Teammates available for work packages (a package's role is a teammate's key, or its short
    form without "_engineer"; a role nobody has goes to the first teammate listed):

    {teammates}

    Choose the smallest suitable stack (do not force Python, a web UI, or any framework the
    specification does not support) and prefer one working vertical slice over breadth. Write
    docs/architecture.md (goals and non-goals, stack and why, project tree, data model and
    contracts, flows, security boundaries, failure behaviour). Then return the plan: the stack;
    the exact project commands (setup, test, lint, build, run) as lists of command lines; and
    work packages. Each work package has an id (WP-1, ...), a title, a role ("backend",
    "frontend", ...; only create a frontend package if the product has a user interface), a
    description, the paths it owns (gitignore-style globs, for example "src/api/**"), the ids
    of the packages it depends on, and the acceptance criteria ids it delivers (existing ids
    from the specification; every package delivers at least one, and every criterion is
    delivered by some package). Packages that do not depend on each other run at the same time
    and may change only the paths they own, so give each package its own directories (tests
    belong to the package they test) and make owned paths disjoint. Never give a package a
    shared root file such as README.md, package.json, pyproject.toml, a lockfile, or CI
    configuration: the foundation stage owns those and an integration stage runs afterwards to
    reconcile the packages. Mark a package "required": false only if the product works without
    it. Also list the main risks.

    {card}
    {notes}
    {resume_note}
  expected_output: >
    docs/architecture.md written in the workspace, and a JSON plan (stack, commands,
    work_packages, risks).

foundation:
  description: >
    Create the shared project foundation for {project_name} in {workspace_path}.

    Specification:

    {spec}

    Plan:

    {plan}

    Create or improve a conventional structure for the chosen stack: dependency and tool
    configuration, a safe .gitignore, .env.example when configuration is needed, and a useful
    README.md (setup, run, test, architecture notes). Implement the shared pieces every work
    package will build on and the thinnest real vertical slice. Leave no placeholder functions
    where working behaviour is feasible. Install only necessary dependencies and run the
    cheapest relevant compile, import, or build check. Preserve compatible existing behaviour.

    {card}
    {notes}
    {resume_note}
  expected_output: >
    A runnable project foundation with README.md. Report files changed, dependencies added,
    commands run with their exit codes, and the remaining work.

implement:
  description: >
    Implement one work package of {project_name} in {workspace_path}.

    Specification:

    {spec}

    Plan:

    {plan}

    Your work package:

    {package}

    Read the architecture and the code that exists before editing. Implement real, end to end
    behaviour for the acceptance criteria this package delivers, add focused tests next to the
    code, validate inputs and error paths, keep secrets out of the repository, and run the
    relevant tests or smoke checks. You may change only the paths your package owns
    (owned_paths); teammates are working on the others at the same time, so everything else is
    read-only for you. If you need a change elsewhere (a shared file, another package's
    interface), do not work around it: describe it in your summary or in a card comment so the
    integration stage can make it.

    {card}
    {notes}
    {resume_note}
  expected_output: >
    The work package implemented in the workspace with tests. Report the criteria delivered,
    files changed, commands run with their exit codes, and any honest limitation.

integrate:
  description: >
    Integrate the work packages of {project_name} in {workspace_path}. They were built in
    parallel, each by an agent that could change only its own paths, so they may disagree where
    they meet (interfaces, imports, configuration, shared files).

    Specification:

    {spec}

    Plan:

    {plan}

    Work package results (status, summary, error):

    {packages}

    Read what each package delivered, then build the whole project and run its tests, lint, and
    type checks. Fix cross-package contract mismatches and anything a skipped or failed
    optional package left dangling; you may change any file, including the shared files
    (README.md, dependency manifests, CI configuration). Keep fixes minimal and do not
    rewrite a package's design. Write docs/integration.md listing what you ran with exit
    statuses, every change you made and why, and any package that is missing or incomplete.

    {card}
    {notes}
    {resume_note}
  expected_output: >
    A project whose packages work together, and docs/integration.md recording the commands run
    and every change made.

repair:
  description: >
    The controller ran its own independent checks on {project_name} in {workspace_path} and
    some required ones failed. You did not run them, and what you report does not change the
    outcome: the controller runs the same checks again when you finish, and only passing checks
    count.

    Specification:

    {spec}

    Plan:

    {plan}

    What failed:

    {failures}

    Find the cause of each failure (read the failing code and tests; run the check's command
    yourself to reproduce it) and fix the code. Never weaken, delete, skip, or special-case a
    test or a check to get it green, and do not edit docs/verification.md (the controller writes
    it). Keep the changes minimal and in scope; if a failure shows the specification itself is
    wrong, say so instead of bending the code. Run the failing command again before you finish.
    Reply with a short summary: the root cause, the files you changed, and anything you could
    not fix. The controller records it in docs/qa-notes.md; do not write that file yourself.

    {card}
    {notes}
    {resume_note}
  expected_output: >
    The failing checks fixed in the workspace, and a short summary of the root cause, the files
    changed, and what is still failing.

review:
  description: >
    Review the finished project {project_name} in {workspace_path}. You can only read it: do
    not write or change any file, and do not report anything you have not seen in the code.

    Specification:

    {spec}

    Read the specification, then the source files, tests, configuration, and documentation
    (use the search, symbol, and Git history tools to find your way), and judge the project
    against your own checklist. Report each real defect once, with the file and line, a
    severity (critical, high, medium, low, info) that reflects its impact on the product, and
    a concrete suggested fix. Leave out style preferences and anything that is not a defect.
    If you find nothing, say so with an empty list. If you ran a tool, name it and what it
    reported; if a tool could not run, say that instead of guessing.

    {card}
    {notes}
    {resume_note}
  expected_output: >
    A JSON review report: a one- or two-sentence summary and a findings list (each finding has
    severity, summary, file, line, and suggested_fix).

repair_review:
  description: >
    Independent reviewers read {project_name} in {workspace_path} and found problems the
    controller wants fixed. What you report does not change the outcome: the controller runs
    its checks again when you finish, and only passing checks count.

    Specification:

    {spec}

    Plan:

    {plan}

    Review findings to fix:

    {findings}

    For each finding, confirm it in the code first (a finding can be wrong; if it is, leave
    the code alone and say why), then make the smallest correct fix. Never weaken, delete, skip,
    or special-case a test or a check to get it green, and do not edit docs/verification.md or
    docs/review.md (the controller writes them). Run the project's tests again before you
    finish. Reply with a short summary: for each finding id, fixed or not and why, and the files
    you changed. The controller records it in docs/qa-notes.md; do not write that file yourself.

    {card}
    {notes}
    {resume_note}
  expected_output: >
    The confirmed findings fixed in the workspace, and a short summary per finding id.

devops:
  description: >
    Prepare {project_name} in {workspace_path} to be run and shipped.

    Specification:

    {spec}

    Plan (it has the project's commands):

    {plan}

    Read the project and its README first, then add only what fits: a Dockerfile when the
    project is a service or would benefit from one (pinned base image, non-root user, no
    secrets baked in) and a .dockerignore; a CI workflow (for example .github/workflows/ci.yml)
    that runs the project's own install, test, lint, and build commands; a complete
    .env.example listing every environment variable the code reads, with placeholder values;
    and short run scripts only where they save steps. Do not change application code. Run
    whatever you can to check your files (the project commands, a Docker build if Docker is
    available) and record what you could not run. Write docs/devops.md: each file you added or
    changed and why, the commands you ran with their outcome, and what is unchecked.

    {card}
    {notes}
    {resume_note}
  expected_output: >
    The delivery files in the workspace and docs/devops.md recording them and what was run.

docs:
  description: >
    Write the documentation of {project_name} in {workspace_path}.

    Specification:

    {spec}

    Plan:

    {plan}

    Read the code, the tests, and the existing README first. Then: make README.md accurate (what
    it is and who it is for, install, run, test, configuration, limitations); write
    docs/usage.md (how to use every feature with real, verified examples); and add or update
    CHANGELOG.md (Keep a Changelog style, one entry for this release). Run each command you
    document and mark any step you could not check as unchecked rather than presenting it as
    working. Change documentation files only, never application code, and do not edit
    docs/verification.md, docs/review.md, or docs/release-report.md.

    {card}
    {notes}
    {resume_note}
  expected_output: >
    An accurate README.md, docs/usage.md, and CHANGELOG.md, and a short summary of what was
    checked.

release:
  description: >
    Perform a release-readiness review of {project_name} in {workspace_path}.

    Specification:

    {spec}

    Re-read the request, the architecture, the controller's verification record
    (docs/verification.md; read it, do not edit it), the README, and the important source files. Confirm the project is coherent, starts with its documented
    commands, and delivers the primary vertical slice. Fix only targeted integration,
    documentation, or configuration issues, then rerun the affected check. Make sure README.md
    gives a new developer accurate setup, configuration, run, test, and troubleshooting steps.

    Write docs/release-report.md: delivered scope, criteria status, architecture summary,
    verification evidence, known limitations, security notes, and the next three improvements.
    Do not claim production readiness when only MVP readiness was shown.

    {card}
    {notes}
    {resume_note}
  expected_output: >
    A coherent project with accurate onboarding documentation and docs/release-report.md, and
    a concise delivery summary with the workspace path.

build:
  description: >
    Build {project_name} end to end in {workspace_path}, on your own.

    Request:

    {requirements}

    Choose the smallest suitable stack, design a minimal architecture, implement a working
    vertical slice with focused automated tests, run the tests and a build or startup smoke
    check, fix what fails, and write a README.md (setup, run, test) plus docs/release-report.md
    (delivered scope, how it was verified, known limitations). Inspect the existing workspace
    first and reuse coherent code. Never report a check as passing unless you ran it.

    {card}
    {notes}
    {resume_note}
  expected_output: >
    A working, tested project with README.md and docs/release-report.md, and a summary of what
    was built, what was verified, and what is missing.

analyze_chunk:
  description: >
    Analyse one part of the existing codebase of {project_name} in {workspace_path}. You can
    only read it: do not write or change any file, and do not describe anything you have not
    seen in the code.

    {chunk}

    Read this chunk's entry points, modules, and tests (the symbol, reference, import, and
    search tools help you find your way; Hotspots shows where the history churns). Report:
    a short summary of what this part is for; its main modules (name, path, one-line purpose,
    and which other modules each uses); the key flows through it, as short sentences that
    name real functions or files; the conventions the code actually follows (naming, error
    handling, structure, test style) so a later change can match them; the risks you can
    point to; and how this part is tested and what is not. Keep every item to one sentence.
    Say "unclear" instead of guessing.

    {card}
    {notes}
    {resume_note}
  expected_output: >
    A JSON analysis (summary, modules, key_flows, conventions, risks, tests).

analyze_synthesis:
  description: >
    Write the codebase map of {project_name} in {workspace_path} from the analyses of its
    parts. You can only read the project: do not write or change any file.

    Facts the controller found (they are certain; do not contradict them):

    {profile}

    The analyses of the parts (written by other analysts; check anything surprising against
    the code before repeating it):

    {synthesis}

    Combine them into one map: an overview (what the project is and does); the architecture
    (how the parts fit together); the modules that matter (name, path, purpose, what each
    uses); the key flows end to end; the conventions a change must follow; the hotspots
    (use the Hotspots tool when the project has Git history); the risks; and how to run and
    how to test it, using the detected commands. Resolve disagreements between the analyses by
    reading the code. Keep every item to one sentence and leave out what you cannot support.

    {card}
    {notes}
    {resume_note}
  expected_output: >
    A JSON codebase map (overview, architecture, modules, key_flows, conventions, hotspots,
    risks, how_to_run, how_to_test).

spec_change:
  description: >
    Turn the request into a testable specification for a CHANGE to an existing project,
    {project_name}, in {workspace_path}. Do not write files and do not design the solution.

    Request:

    {requirements}

    {context}

    Produce a specification with: a short title and summary; acceptance criteria numbered
    AC-1, AC-2, ... (each id used once) that can each be checked by running or inspecting the
    result, with a kind of functional, quality, constraint, or security; explicit non-goals;
    and the assumptions you make where the request is silent. Describe the new behaviour only
    as it differs from what the project does today (read the project first if the request is
    ambiguous), and add a criterion for each existing behaviour the change could plausibly break
    and must keep (kind constraint), so that regressions are named. Keep it to the smallest
    change that satisfies the request and invent nothing the request does not support.

    Also report your confidence (high, medium, or low). List a blocking question only when its
    answer would materially change the change and you cannot reasonably assume it; for each,
    also write the answer you would assume under assumptions. Minor uncertainties go in
    open_questions. Ask at most five blocking questions.

    {card}
    {notes}
    {resume_note}
  expected_output: >
    A JSON specification (title, summary, criteria, non_goals, assumptions, open_questions,
    confidence, blocking_questions).

impact:
  description: >
    Plan the change to the existing project {project_name} in {workspace_path}. Do not edit
    any file: you design, the others implement.

    Specification:

    {spec}

    Original request:

    {requirements}

    {context}

    First read the code the change touches (the codebase map above is a guide, not evidence:
    confirm it in the code; the symbol, reference, import, and test-finding tools show who
    depends on what). Then produce the impact plan as JSON: the project's existing stack
    (do not change it); leave commands empty (the controller uses the project's own commands);
    work packages, each with an id, a title, a role (a teammate from the list below), a
    description that names the files to change or add, the migrations or data changes it needs,
    and how it is tested, the exact owned_paths (the files or directories it may change: as
    narrow as possible, never a directory that holds unrelated code; a root file such as
    package.json or pyproject.toml is allowed when the change needs it), depends_on, and the
    criteria_ids it delivers. Packages that do not depend on each other and own different paths
    run at the same time. Also list the risks: what the change could break, what is untested,
    what needs a human decision. Follow the conventions the code already has; plan the smallest
    change that delivers the criteria, and no refactoring the request did not ask for.

    Teammates available for work packages (a package's role is a teammate's key, or its short
    form without "_engineer"):

    {teammates}

    {card}
    {notes}
    {resume_note}
  expected_output: >
    A JSON plan (stack, commands left empty, work_packages with owned_paths and criteria_ids,
    risks).

implement_change:
  description: >
    Implement one work package of a change to the existing project {project_name} in
    {workspace_path}.

    Specification:

    {spec}

    Plan:

    {plan}

    Your work package:

    {package}

    {context}

    Read the code you will change and the code around it first, and follow what you find: its
    naming, structure, error handling, comments, and test style, and the project's lint and
    format configuration. Keep the diff minimal: change only what the criteria need, do not
    reformat, rename, reorder, or tidy code you were not asked to change, and do not touch
    generated files or lockfiles by hand. Run the project's own tests and checks for what you
    changed. You may change only the paths your package owns (owned_paths); teammates work on
    the others at the same time, so everything else is read-only for you. If you need a change
    elsewhere, describe it in your summary or in a card comment instead of working around it.

    {card}
    {notes}
    {resume_note}
  expected_output: >
    The work package implemented with the smallest diff. Report the criteria delivered, files
    changed, commands run with their exit codes, and any honest limitation.

tests:
  description: >
    Add or update the automated tests for the change to the existing project {project_name} in
    {workspace_path}.

    Specification:

    {spec}

    Plan:

    {plan}

    {context}

    First find how this project tests itself: the test directories, the framework, the naming
    and fixture conventions, and how existing tests for nearby code are written. Then write the
    tests the change needs in exactly that style: at least one test per acceptance criterion
    that describes behaviour, tests for the edge cases and error paths of the new code, and an
    updated version of any existing test the change legitimately invalidates (say so in your
    summary). Never weaken, delete, or skip an existing test to make it pass. Keep to test files
    and the test support code; do not change the code under test (if it is wrong, say so in
    your summary). Run the project's tests for what you added and fix your own tests until they
    pass. Tests that were failing before the change (the baseline) are not yours to fix.

    {card}
    {notes}
    {resume_note}
  expected_output: >
    The tests in the workspace, passing, and a short summary: tests added or changed per
    criterion, commands run with their exit codes, and anything the change leaves untested.

review_change:
  description: >
    Review the CHANGE the team made to the existing project {project_name} in
    {workspace_path}. You can only read it: do not write or change any file, and do not report
    anything you have not seen in the code.

    Specification:

    {spec}

    The team started from commit {base}. Read the change with Git Diff Between Refs (first
    {base}, second HEAD; start with stat=true) and Git Info diff for anything not committed
    yet, then read the changed files in full where the diff is not enough, and the code that
    calls them. Judge the change, not the whole project: report only defects the change
    introduced or left behind, each once, with the file and line, a severity (critical, high,
    medium, low, info) that reflects its impact, and a concrete suggested fix. Also report as
    low or medium any part of the diff that is noise (unrelated reformatting, renames, files
    nobody asked for) and any acceptance criterion the change does not deliver. Leave out style
    preferences. If you find nothing, say so with an empty list. If you ran a tool, name it and
    what it reported; if a tool could not run, say that instead of guessing.

    {card}
    {notes}
    {resume_note}
  expected_output: >
    A JSON review report: a one- or two-sentence summary and a findings list (each finding has
    severity, summary, file, line, and suggested_fix).

triage:
  description: >
    Triage a bug in the existing project {project_name} in {workspace_path}. Do not change any
    file in this step: you find where to look, the next step reproduces it.

    The bug report:

    {requirements}

    {bug}

    {context}

    Read the report, then the code it points at (the codebase map above is a guide, not
    evidence: confirm it in the code; the search, symbol, reference, import, and Git history
    tools show who calls what and what changed recently). If there is a stack trace, start at its
    innermost project frame. Return a short title for the bug, a summary of what goes wrong and
    what should happen instead, and two or three ranked hypotheses, most likely first: each says
    what you think is wrong, which project files (relative paths) are the suspects, what in the
    code, the trace, or the history is the evidence, and how likely it is (high, medium, low).
    Also say how a failing automated test or a small script could show the bug (reproduction_idea):
    the input, the call, the wrong result, and what the right one is. Name only files you have
    seen, and say "unclear" instead of guessing.

    {card}
    {notes}
    {resume_note}
  expected_output: >
    A JSON triage (title, summary, hypotheses with suspects, evidence and likelihood,
    suspect_files, reproduction_idea).

reproduce:
  description: >
    Reproduce the bug in the existing project {project_name} in {workspace_path}: write a test
    or a small script that FAILS because of the bug and would pass once it is fixed.

    The bug report:

    {requirements}

    {bug}

    Triage (the debugger's earlier reading, not evidence):

    {triage}

    {context}

    Follow the project's own test conventions: put the test where similar tests live, in the
    framework and style they use, and name it for the behaviour (a regression test that stays in
    the project). Use a script only when no test can show the bug (a crash on start-up, a command
    line); keep it small and put it next to the code it exercises. Make the assertion state the
    RIGHT behaviour, so the test fails today with a message that shows the wrong one. Do not
    change any other file and do not fix the bug: the controller runs your reproduction on the
    project as it is, and accepts it only if it fails because of the bug (a test that passes,
    cannot be collected, cannot import something, or hangs is not a reproduction). Run it
    yourself first and look at the failure: is it the bug, and not a typo in your test?

    Return the exact command line that runs your reproduction (one command, no shell operators,
    for example `python -m pytest tests/test_notes.py::test_search_keeps_order`), the files you
    created or changed for it (relative paths), kind (test or script), what the failure says
    (expected_failure), and a one-line summary. If you cannot reproduce the bug from what you
    were given after a real try, return no command and put your concrete questions for the
    person in questions (what input, what environment, what output); never invent a bug you
    did not see.

    {card}
    {notes}
    {resume_note}
  expected_output: >
    A JSON reproduction (command, files, kind, expected_failure, summary, questions), with the
    failing test or script written in the workspace.

fix:
  description: >
    Fix the bug in the existing project {project_name} in {workspace_path} with the smallest
    correct change.

    The bug report:

    {requirements}

    {bug}

    Triage (the debugger's earlier reading, not evidence):

    {triage}

    The reproduction (the controller ran it and saw it fail before any change):

    {repro}

    {context}

    Find the root cause (reproduce it yourself first: run the reproduction command and read the
    failure), then fix the cause, not the symptom. Follow the conventions of the code around it
    and keep the diff minimal: change only what the cause needs, do not reformat, rename, or tidy
    unrelated code. The reproduction files are read-only for you and the controller checks them:
    never edit, weaken, skip, or delete a test to make it pass, and do not edit
    the controller's reports. The controller will run the same command again and require it to
    pass, together with the project's own checks (which must show no new failure); failures the
    project had before are not yours to fix. Run the reproduction and the nearby tests yourself
    before you finish.

    Return a JSON note: the root cause (one or two sentences, in terms of the code), what you
    changed and why that fixes it, the risk (what else this change could affect and what is not
    tested), and the files you changed.

    {card}
    {notes}
    {resume_note}
  expected_output: >
    The bug fixed in the workspace, and a JSON note (root_cause, change, risk, files).

repair_fix:
  description: >
    The controller ran its own independent checks on the fix of a bug in {project_name} in
    {workspace_path} and some required ones failed. You did not run them, and what you report
    does not change the outcome: the controller runs the same checks again when you finish, and
    only passing checks count.

    The bug report:

    {requirements}

    The reproduction (it must pass, and its files are read-only for you):

    {repro}

    What failed:

    {failures}

    Find the cause of each failure (read the failing code and tests; run the check's command
    yourself to reproduce it) and fix the code. Never weaken, delete, skip, or special-case a
    test or a check to get it green, and do not edit the controller's reports. Keep the changes
    minimal and in scope. Run the failing command again before you finish. Reply with a short
    summary: the root cause, the files you changed, and anything you could not fix.

    {card}
    {notes}
    {resume_note}
  expected_output: >
    The failing checks fixed in the workspace, and a short summary of the root cause, the files
    changed, and what is still failing.

review_fix:
  description: >
    Review the FIX the team made for a bug in the existing project {project_name} in
    {workspace_path}. You can only read it: do not write or change any file, and do not report
    anything you have not seen in the code.

    The bug report:

    {requirements}

    The reproduction (it failed before the fix and passes after it, as the controller saw):

    {repro}

    The debugger's account of the fix (not evidence):

    {fix_note}

    The team started from commit {base}. Read the change with Git Diff Between Refs (first
    {base}, second HEAD; start with stat=true) and Git Info diff for anything not committed yet,
    then read the changed files in full where the diff is not enough, and the code that calls
    them. Judge the change, not the whole project: does it remove the cause or only hide the
    symptom? Could it break callers or other inputs (look at the callers)? Is the regression
    test meaningful, or does it only pass by accident? Is anything in the diff noise (unrelated
    reformatting, renames)? Report only real defects, each once, with the file and line, a
    severity (critical, high, medium, low, info) that reflects its impact, and a concrete
    suggested fix. Leave out style preferences. If you find nothing, say so with an empty list.
    If you ran a tool, name it and what it reported; if a tool could not run, say that instead of
    guessing.

    {card}
    {notes}
    {resume_note}
  expected_output: >
    A JSON review report: a one- or two-sentence summary and a findings list (each finding has
    severity, summary, file, line, and suggested_fix).

custom:
  description: >
    Do one step of a task on the existing project {project_name} in {workspace_path}. The task
    for this step is written by whoever set up the recipe:

    {instructions}

    The request this run was started with:

    {requirements}

    {context}

    Read the code you will touch first and follow the conventions you find. Keep the change as
    small as the step needs, never weaken, delete, or skip a test to get a check green, and run
    the project's own checks for what you changed. Reply with a short summary: what you did, the
    files you changed, and what you could not do.

    {card}
    {notes}
    {resume_note}
  expected_output: >
    The step done in the workspace, and a short summary of what was done, which files changed, and
    what is left.

add_tests:
  description: >
    Add characterization tests to the existing project {project_name} in {workspace_path}: tests
    that pin what the code does TODAY, so a later change that alters behaviour fails them. You
    may write test files and test support only; the file tools refuse anything else, and the
    controller checks the diff. Do not change production code, even to make it testable.

    The request (what to cover, if the person said):

    {requirements}

    {coverage}

    {context}

    First find how this project tests itself: the test directories, the framework, the naming and
    fixture conventions, and tests written for nearby code. Then find the code with no tests (the
    coverage list above, the symbol, reference and test-finding tools, and Git history show what is
    untested and what changes often) and write tests for it in exactly that style: the public
    behaviour of each untested module first, then its edge cases and error paths. Assert what the
    code really does, even where that looks wrong: if a behaviour looks like a bug, pin it with
    a comment saying so and report it in your summary, do not fix it. Tests must be deterministic
    (no network, clock, or random without control) and fast. Run the new tests and make them pass
    against the unchanged code; a test you cannot make pass honestly is dropped, not weakened.

    {card}
    {notes}
    {resume_note}
  expected_output: >
    New test files in the workspace that pass on the unchanged code, and a short summary: the
    modules covered, what each test pins, behaviour that looks like a bug, and what is still
    untested.

repair_tests:
  description: >
    The controller ran its own independent checks after characterization tests were added to
    {project_name} in {workspace_path}, and some required ones failed. What you report does not
    change the outcome: the controller runs the checks again when you finish. You may change test
    files only, and the controller checks the diff.

    What failed:

    {failures}

    A characterization test that fails on the unchanged code is wrong, not the code: fix the test
    so it describes what the code really does (run it to see), or delete it if it cannot be made
    deterministic. If the policy check lists files that are not tests, revert them. Never touch
    production code and never weaken a test that passed before this work.

    {card}
    {notes}
    {resume_note}
  expected_output: >
    The failing checks fixed by correcting the new tests, and a short summary of what changed.

refactor:
  description: >
    Refactor the existing project {project_name} in {workspace_path} WITHOUT changing its
    behaviour. The project's tests pass now; they must pass unchanged afterwards.

    What to refactor (the person's goal):

    {requirements}

    {context}

    Read the code and its tests first (the symbol, reference and import tools show who depends on
    what). Make the smallest set of behaviour-preserving changes that achieves the goal (extract,
    rename, simplify, remove duplication) and follow the conventions around the code. Hard rules,
    checked by the controller: never edit, delete or skip an existing test; never touch a
    dependency manifest or lockfile; keep the diff within maintain.max_refactor_lines (split a
    bigger refactor and do the first part). Do not change public interfaces, outputs, error
    messages, or file formats. Run the project's tests after each step and stop at a state where
    they pass. If the goal cannot be reached without changing behaviour, do the safe part and say
    what is left and why.

    {card}
    {notes}
    {resume_note}
  expected_output: >
    The refactor in the workspace with the project's tests passing, and a short summary: what was
    changed and why behaviour is unchanged, files touched, commands run with exit codes, and what
    was left alone.

repair_refactor:
  description: >
    The controller ran its own independent checks after a behaviour-preserving refactor of
    {project_name} in {workspace_path}, and some required ones failed (a test, or a policy about
    the diff). What you report does not change the outcome: the controller runs the checks again
    when you finish.

    What failed:

    {failures}

    A test that passed before the refactor and fails now means the refactor changed behaviour:
    undo or correct the refactor, never the test (existing tests may not be edited, deleted or
    skipped). If a policy names files (a test, a manifest, too many lines), revert them or shrink
    the change. Run the failing command again before you finish and reply with a short summary.

    {card}
    {notes}
    {resume_note}
  expected_output: >
    The refactor corrected so the checks pass, and a short summary of what you undid or changed.

docs_legacy:
  description: >
    Document the existing code of {project_name} in {workspace_path}. You may write documentation
    files only (Markdown, reStructuredText, the docs directory, the README and CHANGELOG); the
    file tools refuse anything else and the controller checks the diff. Do not change code,
    including comments and docstrings.

    The request (what to document, if the person said):

    {requirements}

    {context}

    Read the code, its tests, and the existing documentation first (the codebase map above is a
    guide, not evidence: confirm it in the code). Then write what a new maintainer needs and the
    project lacks: what it is and who uses it; how to set it up, run, and test it (use the
    commands that really work; run them); the architecture and the main flows with real module
    and function names; configuration and environment variables the code reads; data formats and
    external services; conventions to follow; known quirks and risks. Update wrong or stale
    existing documentation instead of adding a second version. Mark anything you could not verify
    as unchecked and never describe behaviour you have not read in the code.

    {card}
    {notes}
    {resume_note}
  expected_output: >
    Accurate documentation files in the workspace and a short summary: the files written or
    changed, what was verified by running it, and what is unchecked.

repair_docs:
  description: >
    The controller ran its own independent checks after documentation was written for
    {project_name} in {workspace_path}, and some required ones failed (usually a policy: a file
    that is not documentation was changed). What you report does not change the outcome: the
    controller runs the checks again when you finish. You may change documentation files only.

    What failed:

    {failures}

    Revert every change the policy lists (code, tests, configuration, comments) and keep the
    documentation. Reply with a short summary of what you reverted.

    {card}
    {notes}
    {resume_note}
  expected_output: >
    The non-documentation changes reverted, and a short summary.

review_maintain:
  description: >
    Review the CHANGE the team made to the existing project {project_name} in {workspace_path}
    as a maintenance task. You can only read it: do not write or change any file, and do not
    report anything you have not seen in the code.

    The task:

    {requirements}

    The team started from commit {base}. Read the change with Git Diff Between Refs (first {base},
    second HEAD; start with stat=true) and Git Info diff for anything not committed yet, then the
    changed files in full where the diff is not enough. Judge the change against the task: does
    it do what was asked and nothing else? Does it keep behaviour (a refactor) or pin it (tests)?
    Is anything in the diff noise (unrelated reformatting, renames, files nobody asked for)?
    Report only real defects, each once, with the file and line, a severity (critical, high,
    medium, low, info) that reflects its impact, and a concrete suggested fix. Leave out style
    preferences. If you find nothing, say so with an empty list. If you ran a tool, name it and
    what it reported; if a tool could not run, say that instead of guessing.

    {card}
    {notes}
    {resume_note}
  expected_output: >
    A JSON review report: a one- or two-sentence summary and a findings list (each finding has
    severity, summary, file, line, and suggested_fix).

review_diff:
  description: >
    Review a change to the project {project_name} in {workspace_path}. You can only read it: do
    not write or change any file, and do not report anything you have not seen in the code.

    The person's focus for this review, if any:

    {requirements}

    The change is everything since commit {base}: the commits on this branch and any uncommitted
    work. Read it with Git Diff Between Refs (first {base}, second HEAD; start with stat=true)
    and Git Info diff for what is not committed, then read the changed files in full where the
    diff is not enough, and the code that calls them (the symbol, reference and import tools show
    who depends on what). Judge the change, not the whole project: report only defects the
    change introduced or left behind, each once, with the file and line, a severity (critical,
    high, medium, low, info) that reflects its real impact, and a concrete suggested fix. Your
    checklist covers correctness, error handling, security, data loss, concurrency, API and
    compatibility breaks, missing or weak tests for the new behaviour, and maintainability that
    will cost the next person. Leave out style preferences and anything the project's linter
    owns. If you find nothing, say so with an empty list. If you ran a tool, name it and what it
    reported; if a tool could not run, say that instead of guessing.

    {card}
    {notes}
    {resume_note}
  expected_output: >
    A JSON review report: a one- or two-sentence summary and a findings list (each finding has
    severity, summary, file, line, and suggested_fix).

dependency_plan:
  description: >
    Plan the dependency upgrades for the existing project {project_name} in {workspace_path}.
    Do not edit any file in this step: you decide what to try, the next step applies it in groups
    and the controller checks each group with the project's own tests.

    The request (which dependencies, and how far, if the person said):

    {requirements}

    {context}

    Read the dependency manifests and lockfiles (the Inspect Dependencies tool lists the declared
    and locked versions) and find newer versions: ask the package registries with the package
    information and web tools when they are available, or the project's package manager through
    the command tool (for example `pip list --outdated`, `npm outdated`, `cargo outdated`)
    when it works offline. Propose an upgrade only to a version you found, never one you assume.
    Prefer, in this order: versions that fix a known vulnerability, patch and minor updates, and
    only then majors (a major is one upgrade of its own, with the migration risk in the reason).
    Return the plan as JSON: each upgrade names the package, the manifest that declares it
    (relative path), the current version, the target version, and why. List in skipped every
    dependency you chose to leave alone, each with the reason (pinned on purpose, no newer
    version, abandoned). Order the upgrades with the safest first.

    {card}
    {notes}
    {resume_note}
  expected_output: >
    A JSON upgrade plan: upgrades (package, manifest, current, target, reason) and skipped
    (package and reason).

upgrade_apply:
  description: >
    Apply this group of dependency upgrades to the existing project {project_name} in
    {workspace_path}:

    {upgrades}

    Edit the dependency manifest that declares each package (pyproject.toml, requirements*.txt,
    package.json, Cargo.toml, go.mod, pom.xml, ...) to the target version, keeping its style
    and any version range convention the file uses. You may change manifests and lockfiles only;
    the file tools refuse anything else and the controller checks the diff. Regenerate a
    lockfile only with the project's own package manager when it works offline; the controller
    installs the dependencies and runs the project's checks itself afterwards, and undoes the
    whole group if they fail, so do not try to fix application code to make an upgrade fit.
    Reply with a short summary of the edits, and name any upgrade you could not apply and why.

    {card}
    {notes}
    {resume_note}
  expected_output: >
    The manifests edited for exactly this group, and a short summary of the edits and anything
    that could not be applied.

repair_upgrade:
  description: >
    The controller ran its own independent checks on the upgraded project {project_name} in
    {workspace_path}, and some required ones failed (usually a policy: a file that is not a
    manifest or lockfile changed). What you report does not change the outcome: the controller
    runs the checks again when you finish. You may change manifests and lockfiles only.

    What failed:

    {failures}

    Revert what the policy lists. If a manifest edit itself is the cause, restore the previous
    version of that dependency. Reply with a short summary.

    {card}
    {notes}
    {resume_note}
  expected_output: >
    The failing checks fixed by reverting or correcting manifest edits, and a short summary.

audit_security:
  description: >
    Audit the security of the existing project {project_name} in {workspace_path}. You can only
    read it: do not write or change any file, and do not report anything you have not seen in the
    code.

    The request (the focus, if the person said):

    {requirements}

    {audit}

    {context}

    Read the code with the eyes of an attacker: where untrusted input enters (requests, files,
    environment, command line, deserialization), where it reaches a dangerous sink (SQL, shell,
    paths, templates, eval, redirects, outbound requests), authentication and authorization checks
    and where they are missing, secrets in code or history, unsafe defaults, weak cryptography,
    unsafe dependency use, and logging of sensitive data. Use the search, symbol, reference and
    Git history tools to trace flows end to end; run the dependency tools if they help. The
    dependency audit above was run by the controller: do not repeat its findings, but say what a
    vulnerable dependency means for how this project uses it when you can see it. Report each
    real problem once, with the file and line, a severity (critical, high, medium, low, info)
    that reflects exploitability and impact, and a concrete suggested fix. Leave out theoretical
    issues you cannot point to in the code. If you find nothing, say so with an empty list.

    {card}
    {notes}
    {resume_note}
  expected_output: >
    A JSON review report: a one- or two-sentence summary and a findings list (each finding has
    severity, summary, file, line, and suggested_fix).

fix_findings:
  description: >
    Fix the serious security findings in the existing project {project_name} in {workspace_path}
    with the smallest correct changes.

    The findings (from the audit; each is a claim, confirm it in the code first):

    {findings}

    For each finding: confirm it in the code (leave a wrong finding alone and say why), fix the
    cause, and keep the diff minimal and in the project's style. For a vulnerable dependency,
    edit the manifest to the fixed version only if the project's tests can tell it still works;
    otherwise say that it needs a human. Never weaken, skip, or delete a test. Run the project's
    tests for what you changed. Reply with a short summary: for each finding id, fixed or not
    and why, and the files you changed.

    {card}
    {notes}
    {resume_note}
  expected_output: >
    The confirmed findings fixed in the workspace and a short summary per finding id.
