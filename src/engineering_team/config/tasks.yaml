architecture_task:
  description: >
    Analyze the request for {project_name} and inspect the current project tree at
    {workspace_path}. Requirements:

    {requirements}

    Choose the smallest suitable architecture and technology stack. Do not force
    Python, Gradio, a web UI, or any other stack unless the request supports it.
    Prefer a working vertical slice over broad scaffolding. Reuse coherent
    existing code when this is a resumed run.

    Write docs/architecture.md and docs/implementation-plan.md. Together they
    must cover: goals and non-goals; explicit assumptions; acceptance criteria
    mapped to components; chosen stack and dependency rationale; project tree;
    data model and important contracts; user/API/CLI flows as applicable;
    security and privacy boundaries; failure behavior; staged specialist
    assignments; and exact validation commands. Resolve ordinary technical
    choices yourself and flag only product decisions that materially block a
    useful MVP.
  expected_output: >
    Two concise, internally consistent architecture documents written in the
    project workspace, plus a final summary of the stack, vertical slice,
    assignments, assumptions, and material risks.
  markdown: true

foundation_task:
  description: >
    Read the architecture documents and existing files for {project_name}. Create
    or improve a conventional project structure for the selected stack. Add
    dependency and tool configuration, a safe .gitignore, .env.example when
    configuration is needed, and a useful README.md with setup, run, test, and
    architecture notes.

    Implement the shared foundation and the thinnest real vertical slice needed
    by later work. Do not leave placeholder functions where working behavior is
    feasible. Install or synchronize only necessary dependencies and run the
    cheapest relevant compile, import, or build smoke check. Preserve compatible
    existing behavior on resumed runs.
  expected_output: >
    A clean, runnable project foundation in the workspace with README.md and
    configuration appropriate to the chosen stack. Report files changed,
    dependencies added, commands run, exit codes, and the remaining work.
  context:
    - architecture_task

backend_task:
  description: >
    Implement the non-visual application behavior required for {project_name}.
    Follow docs/architecture.md and inspect the code created so far. Depending on
    the selected product, this can include domain logic, persistence, API
    routes, integrations, background jobs, a CLI, or shared application state.

    Complete real end-to-end behavior for the primary acceptance criteria. Add
    focused tests near the implementation, validate inputs and error paths,
    avoid embedded secrets, and run the relevant tests or smoke checks. If the
    architecture genuinely needs no separate backend, strengthen the shared
    core or primary non-visual logic instead of inventing a service.
  expected_output: >
    Working core behavior committed to the shared project tree, with focused
    tests or smoke checks. Report implemented acceptance criteria, files
    changed, commands and exit codes, and any honest limitation.
  context:
    - architecture_task
    - foundation_task

frontend_task:
  description: >
    Implement the user-facing experience specified for {project_name}. Read the
    architecture and the actual application contracts before editing. Connect
    the interface to real behavior; do not build a disconnected mock.

    Keep the scope to primary MVP journeys. Provide accessible, responsive,
    coherent states for initial/empty, loading or processing, success,
    validation failure, and operational failure as applicable. Reuse the chosen
    stack and design language. Run an available build, component, render, or
    construction check. If the product has no visual UI, implement and validate
    its primary human-facing CLI, API examples, or usage experience instead.
  expected_output: >
    A working primary interaction connected to the application core. Report
    journeys completed, accessibility/error states covered, files changed,
    commands and exit codes, and remaining visual or interaction limitations.
  context:
    - architecture_task
    - foundation_task
    - backend_task

quality_task:
  description: >
    Independently verify the complete {project_name} workspace against the
    requirements and docs/architecture.md. Inspect all implementation rather
    than trusting previous summaries. Build a requirements-to-test matrix, add
    the highest-value missing tests, and exercise primary success and failure
    paths across component boundaries.

    Run the relevant test suite, type/lint checks when configured, production
    build or compile, and a minimal startup or end-to-end smoke test that will
    not block indefinitely. Diagnose failures, make safe in-scope fixes, and
    rerun affected checks until they pass. Never weaken a meaningful test merely
    to get green output. Check for committed secrets, unsafe defaults, and
    misleading README instructions.

    Write docs/verification.md with acceptance criteria, exact commands, exit
    status, what each check proved, defects fixed, and remaining gaps.
  expected_output: >
    A tested, integrated MVP plus docs/verification.md containing reproducible
    evidence. The final summary must distinguish passing checks, fixes made,
    checks not run, and residual risks.
  context:
    - architecture_task
    - foundation_task
    - backend_task
    - frontend_task
  markdown: true

release_task:
  description: >
    Perform a release-readiness review of {project_name} on behalf of the
    engineering lead. Re-read the original requirements, architecture,
    verification record, README, and important source files. Confirm the
    generated project is coherent, starts using documented commands, and
    delivers the primary vertical slice.

    Fix only targeted integration, documentation, or configuration issues found
    during this review, then rerun the affected check. Ensure README.md gives a
    new developer accurate setup, configuration, run, test, and troubleshooting
    instructions. Write docs/release-report.md with delivered scope, acceptance
    criteria status, architecture summary, verification evidence, known
    limitations, security notes, and the next three highest-value improvements.
    Do not claim production readiness when only MVP readiness was demonstrated.
  expected_output: >
    A coherent MVP workspace with accurate onboarding documentation and
    docs/release-report.md. Return a concise delivery summary, exact final
    verification evidence, known limitations, and the workspace path.
  context:
    - architecture_task
    - foundation_task
    - backend_task
    - frontend_task
    - quality_task
  markdown: true
