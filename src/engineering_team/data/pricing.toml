# USD per 1,000,000 tokens, standard (non-batch, non-priority) tier.
#
# Checked against each provider's own pricing page on `as_of`. Prices change often: update this
# file (and `as_of`) rather than hard-coding numbers elsewhere. Users can override any model in
# their own config (`[pricing."provider/model"]`, see docs/CONFIGURATION.md).
#
#   input         fresh (uncached) prompt tokens
#   cached_input  prompt tokens served from the provider's cache (falls back to `input`)
#   cache_write   prompt tokens written to a cache (falls back to `input`)
#   output        completion tokens, including reasoning/thinking tokens
#   valid_from / valid_until   inclusive dates; several rows can cover one model over time
#
# A model with no row has an *unknown* cost, which is reported as "unknown", never $0.

[[price]]
model = "openai/gpt-6.1-sol"
input = 2.0
cached_input = 0.10
output = 10.0
source_url = "https://developers.openai.com/api/docs/pricing"
as_of = 2026-10-02
note = "Standard tier. Long-context (>272K) variants and regional-processing uplift are not modelled."

